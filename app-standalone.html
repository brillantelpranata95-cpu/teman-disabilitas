    const INITIAL_REQUESTS = [
      {
        id: 'REQ-101',
        kodeBooking: 'PRSI-2026-001',
        equipmentId: 'EQ-001',
        namaAlat: 'Kursi Roda Standard Ergonomis',

        nomorWaPemohon: '081234567890',

        stage: 'permintaan_masuk',

      {

        equipmentId: 'EQ-003',

        stage: 'permintaan_diterima',

        tanggalJatuhTempo: '2026-07-25',
        statusWaReminderSent: false,
        isArchived: false
      },
      {
        id: 'REQ-103',
        kodeBooking: 'PRSI-2026-003',
        equipmentId: 'EQ-006',
        namaAlat: 'Kasur Medis Anti-Dekubitus',
        namaPemohon: 'Siti Rahmawati',
        alamatPemohon: 'Padukuhan Temon Kulon RT 02/RW 01, Kalurahan Temon Kulon',
        nomorWaPemohon: '089611223344',
        namaPenggunaAlat: 'Bpk. Ahmad Sunardi (68 Thn)',
        catatanKebutuhan: 'Pasien stroke tirah baring lama.',
        stage: 'permintaan_selesai',
        tanggalPengajuan: '2026-06-10',

        isArchived: false
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [equipmentList, setEquipmentList] = useState([]);
      const [requests, setRequests] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('Semua');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [requestModalItem, setRequestModalItem] = useState(null);
      const [detailModalItem, setDetailModalItem] = useState(null);
      const [durationModalRequest, setDurationModalRequest] = useState(null);
      const [equipmentFormItem, setEquipmentFormItem] = useState(null);
      const [isEquipmentFormOpen, setIsEquipmentFormOpen] = useState(false);
      const [adminTab, setAdminTab] = useState('kanban'); // 'kanban' | 'inventory' | 'archive'
      
      const [toast, setToast] = useState(null);

      // Load & Sync LocalStorage
      useEffect(() => {
        const eqData = localStorage.getItem('perisai_temon_eq_v2');
        const reqData = localStorage.getItem('perisai_temon_req_v2');

        if (eqData) setEquipmentList(JSON.parse(eqData));
        else {
          localStorage.setItem('perisai_temon_eq_v2', JSON.stringify(INITIAL_EQUIPMENT));
          setEquipmentList(INITIAL_EQUIPMENT);
        }

        if (reqData) setRequests(JSON.parse(reqData));
        else {
          localStorage.setItem('perisai_temon_req_v2', JSON.stringify(INITIAL_REQUESTS));
          setRequests(INITIAL_REQUESTS);
        }
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const saveEq = (newList) => {
        setEquipmentList(newList);
        localStorage.setItem('perisai_temon_eq_v2', JSON.stringify(newList));
      };

      const saveReq = (newList) => {
        setRequests(newList);
        localStorage.setItem('perisai_temon_req_v2', JSON.stringify(newList));
      };

      // --------------------------------------------------------
      // STOK LOGIC & KANBAN STAGE CHANGE
      // --------------------------------------------------------
      const handlePublicSubmit = (formData) => {
        const randomSuffix = Math.floor(1000 + Math.random() * 9000);
        const newReq = {
          id: `REQ-${Date.now()}`,
          kodeBooking: `PRSI-2026-${randomSuffix}`,
          equipmentId: requestModalItem.id,
          namaAlat: requestModalItem.namaAlat,
          namaPemohon: formData.namaPemohon,
          alamatPemohon: `${formData.detailAlamat}, Kalurahan ${formData.kalurahan}, Kapanewon Temon`,
          nomorWaPemohon: formData.nomorWaPemohon,
          namaPenggunaAlat: formData.namaPenggunaAlat,
          catatanKebutuhan: formData.catatanKebutuhan || 'Peminjaman alat disabilitas',
          stage: 'permintaan_masuk',
          tanggalPengajuan: new Date().toISOString().split('T')[0],
          durasiHariPinjam: null,
          tanggalMulaiPinjam: null,
          tanggalJatuhTempo: null,
          statusWaReminderSent: false,
          isArchived: false
        };

        saveReq([newReq, ...requests]);
        setRequestModalItem(null);
        showToast(`Permohonan ${newReq.kodeBooking} berhasil dikirim ke Superadmin!`, 'success');
      };

      const handleStageChange = (requestId, newStage, extraDetails = {}) => {
        const targetReq = requests.find(r => r.id === requestId);
        if (!targetReq) return;

        const oldStage = targetReq.stage;
        const targetEq = equipmentList.find(e => e.id === targetReq.equipmentId);

        let updatedEqList = [...equipmentList];

        // 1. Moving into Permintaan Diterima -> DECREASE STOCK (-1)
        if (oldStage === 'permintaan_masuk' && newStage === 'permintaan_diterima') {
          if (targetEq) {
            if (targetEq.stokTersedia <= 0) {
              showToast(`Stok ${targetEq.namaAlat} tidak cukup.`, 'error');
              return;
            }
            updatedEqList = updatedEqList.map(e => e.id === targetEq.id ? { ...e, stokTersedia: Math.max(0, e.stokTersedia - 1) } : e);
          }
          showToast(`Permintaan disetujui! Stok ${targetEq?.namaAlat} berkurang 1 unit di dashboard umum.`, 'success');
        }

        // 2. Moving into Permintaan Selesai -> INCREASE STOCK (+1)
        if (oldStage !== 'permintaan_selesai' && newStage === 'permintaan_selesai') {
          if (targetEq) {
            updatedEqList = updatedEqList.map(e => e.id === targetEq.id ? { ...e, stokTersedia: Math.min(e.stokTotal, e.stokTersedia + 1) } : e);
          }
          showToast(`Peminjaman selesai! Stok ${targetEq?.namaAlat} telah bertambah (+1) kembali di dashboard umum.`, 'success');
        }

        saveEq(updatedEqList);

        const updatedReqList = requests.map(r => {
          if (r.id === requestId) {
            return {
              ...r,
              stage: newStage,
              ...extraDetails,
              ...(newStage === 'permintaan_selesai' ? { tanggalSelesai: new Date().toISOString().split('T')[0] } : {})
            };
          }
          return r;
        });

        saveReq(updatedReqList);
      };

      const handleArchive = (requestId) => {
        const updated = requests.map(r => r.id === requestId ? { ...r, isArchived: true } : r);
        saveReq(updated);
        showToast('Permohonan berhasil dipindahkan ke Database Arsip.', 'info');
      };

      const handleDeleteReq = (id) => {
        if (confirm('Menghapus permohonan ini?')) {
          saveReq(requests.filter(r => r.id !== id));
          showToast('Permohonan dihapus.', 'info');
        }
      };

      const handleSendWA = (req) => {
        const raw = req.nomorWaPemohon.replace(/[^0-9]/g, '');
        const phone = raw.startsWith('0') ? '62' + raw.slice(1) : raw;
        const msg = `Halo Bpk/Ibu *${req.namaPemohon}*,\n\nKami dari *PERISAI Temon Kapanewon Temon* menginformasikan mengenai peminjaman alat *${req.namaAlat}* untuk *${req.namaPenggunaAlat}*.\n\nMasa peminjaman alat akan berakhir dalam *3 hari lagi* pada tanggal *${req.tanggalJatuhTempo}*.\n\nMohon konfirmasinya untuk jadwal pengembalian atau perpanjangan. Terima kasih.\n\n_Pemerintah Kapanewon Temon_`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      const handleSaveEqForm = (formData) => {
        const exists = equipmentList.some(e => e.id === formData.id);
        let updated = [];
        if (exists) {
          updated = equipmentList.map(e => e.id === formData.id ? formData : e);
          showToast(`Data ${formData.namaAlat} diperbarui.`, 'success');
        } else {
          updated = [formData, ...equipmentList];
          showToast(`Alat baru ${formData.namaAlat} ditambahkan.`, 'success');
        }
        saveEq(updated);
        setIsEquipmentFormOpen(false);
      };

      const handleDeleteEq = (id) => {
        if (confirm('Hapus alat ini dari inventaris?')) {
          saveEq(equipmentList.filter(e => e.id !== id));
          showToast('Alat dihapus.', 'info');
        }
      };

      const handleResetData = () => {
        if (confirm('Reset seluruh data ke sampel awal Kapanewon Temon?')) {
          saveEq(INITIAL_EQUIPMENT);
          saveReq(INITIAL_REQUESTS);
          showToast('Data berhasil di-reset.', 'info');
        }
      };

      // Calculate Counters
      const totalAvailable = equipmentList.reduce((acc, curr) => acc + (curr.stokTersedia || 0), 0);
      const totalItems = equipmentList.reduce((acc, curr) => acc + (curr.stokTotal || 0), 0);
      const activeRequests = requests.filter(r => !r.isArchived);
      const incomingReqs = activeRequests.filter(r => r.stage === 'permintaan_masuk');
      const acceptedReqs = activeRequests.filter(r => r.stage === 'permintaan_diterima');
      const completedReqs = activeRequests.filter(r => r.stage === 'permintaan_selesai');
      const archivedReqs = requests.filter(r => r.isArchived || r.stage === 'permintaan_selesai');

      const filteredEquipment = equipmentList.filter(item => {
        const matchesSearch = item.namaAlat.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.pemilik.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCat = selectedCategory === 'Semua' || item.jenisAlat === selectedCategory;
        return matchesSearch && matchesCat;
      });

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* NAVBAR */}
          <header className="sticky top-0 z-40 w-full bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setIsAdminMode(false)}>
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-temon-600 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-temon-500/20">
                    <i data-lucide="accessibility" className="w-7 h-7"></i>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="text-xl font-extrabold tracking-tight text-slate-900">PERISAI TEMON</span>
                      <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">Teman Disabilitas</span>
                    </div>
                    <p className="text-xs text-slate-500 font-medium hidden sm:block">Kapanewon Temon • Kulon Progo</p>
                  </div>
                </div>

                <div className="hidden md:flex items-center space-x-3">
                  <div className="px-3.5 py-1.5 rounded-xl bg-slate-100 border border-slate-200 text-xs font-medium text-slate-700">
                    Tersedia: <strong className="text-emerald-700">{totalAvailable} Unit</strong>
                  </div>
                  <div className="px-3.5 py-1.5 rounded-xl bg-slate-100 border border-slate-200 text-xs font-medium text-slate-700">
                    Dipinjam: <strong className="text-amber-700">{acceptedReqs.length} Unit</strong>
                  </div>
                  {incomingReqs.length > 0 && (
                    <div className="px-3.5 py-1.5 rounded-xl bg-rose-50 border border-rose-200 text-xs font-bold text-rose-700 animate-bounce">
                      Permintaan Baru: {incomingReqs.length}
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setIsAdminMode(!isAdminMode)}
                  className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm transition ${
                    isAdminMode
                      ? 'bg-slate-900 text-white ring-2 ring-slate-900/20'
                      : 'bg-gradient-to-r from-temon-600 to-teal-600 text-white shadow-temon-600/20'
                  }`}
                >
                  <i data-lucide={isAdminMode ? 'layout-dashboard' : 'shield-check'} className="w-4 h-4"></i>
                  <span>{isAdminMode ? 'Mode Superadmin (Aktif)' : 'Kelola Superadmin'}</span>
                </button>

              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            {isAdminMode ? (
              /* SUPERADMIN DASHBOARD */
              <div className="space-y-8 pb-16">
                
                {/* Admin Header */}
                <div className="bg-gradient-to-r from-slate-900 via-temon-950 to-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
                  <div className="space-y-2">
                    <span className="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold border border-emerald-400/30">
                      Panel Superadmin Kapanewon Temon
                    </span>
                    <h1 className="text-2xl sm:text-3xl font-extrabold">Sistem Informasi PERISAI Temon</h1>
                    <p className="text-xs sm:text-sm text-slate-300">
                      Kelola inventaris alat, jalankan logic Kanban 3-stage, kirim WA Pengingat H-3, & rekap database arsip.
                    </p>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                    <div className="bg-white/10 p-3 rounded-2xl border border-white/10">
                      <span className="text-[10px] text-slate-300 font-bold block">TOTAL STOK</span>
                      <strong className="text-lg font-bold">{totalItems}</strong>
                    </div>
                    <div className="bg-emerald-500/20 p-3 rounded-2xl border border-emerald-400/30">
                      <span className="text-[10px] text-emerald-300 font-bold block">TERSEDIA</span>
                      <strong className="text-lg font-bold text-emerald-400">{totalAvailable}</strong>
                    </div>
                    <div className="bg-amber-500/20 p-3 rounded-2xl border border-amber-400/30">
                      <span className="text-[10px] text-amber-300 font-bold block">MASUK</span>
                      <strong className="text-lg font-bold text-amber-300">{incomingReqs.length}</strong>
                    </div>
                    <div className="bg-blue-500/20 p-3 rounded-2xl border border-blue-400/30">
                      <span className="text-[10px] text-blue-300 font-bold block">DIPINJAM</span>
                      <strong className="text-lg font-bold text-blue-300">{acceptedReqs.length}</strong>
                    </div>
                  </div>
                </div>

                {/* Admin Nav Tabs */}
                <div className="flex items-center space-x-2 border-b border-slate-200 pb-4 overflow-x-auto">
                  <button
                    onClick={() => setAdminTab('kanban')}
                    className={`px-5 py-3 rounded-2xl font-bold text-xs sm:text-sm flex items-center space-x-2 transition ${
                      adminTab === 'kanban' ? 'bg-slate-900 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'
                    }`}
                  >
                    <i data-lucide="kanban" className="w-4 h-4"></i>
                    <span>Papan Kanban Permintaan</span>
                    {incomingReqs.length > 0 && <span className="px-2 py-0.5 rounded-full text-[10px] bg-rose-500 text-white font-bold">{incomingReqs.length}</span>}
                  </button>

                  <button
                    onClick={() => setAdminTab('inventory')}
                    className={`px-5 py-3 rounded-2xl font-bold text-xs sm:text-sm flex items-center space-x-2 transition ${
                      adminTab === 'inventory' ? 'bg-slate-900 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'
                    }`}
                  >
                    <i data-lucide="package" className="w-4 h-4"></i>
                    <span>Kelola Inventaris Alat ({equipmentList.length})</span>
                  </button>

                <div className="col-span-2">
                  <label className="block font-bold text-slate-700 mb-1">Padukuhan / RT / RW *</label>
                  <input type="text" value={form.detailAlamat} onChange={e=>setForm({...form, detailAlamat: e.target.value})} placeholder="Padukuhan II, RT 03/RW 01" className="w-full p-2.5 bg-slate-50 border rounded-xl outline-none" />
                </div>
              </div>
              <div>
                <label className="block font-bold text-slate-700 mb-1">Catatan Kebutuhan</label>
                <textarea rows={2} value={form.catatanKebutuhan} onChange={e=>setForm({...form, catatanKebutuhan: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-xl outline-none" placeholder="Alasan peminjaman..." />
              </div>
              <div className="pt-2 flex space-x-2">
                <button type="button" onClick={onClose} className="w-1/3 py-2.5 bg-slate-100 font-bold rounded-xl">Batal</button>
                <button type="submit" className="w-2/3 py-2.5 bg-temon-600 text-white font-bold rounded-xl">Kirim Permohonan</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- FORM MODAL: SET DURATION ---
    function SetDurationModal({ request, onClose, onConfirm }) {
      const [days, setDays] = useState(14);
      const handleSave = () => {
        const start = new Date();
        const due = new Date();
        due.setDate(due.getDate() + parseInt(days));
        onConfirm(request.id, days, start.toISOString().split('T')[0], due.toISOString().split('T')[0]);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4">
            <h3 className="font-bold text-slate-900 text-base">Tentukan Berapa Hari Alat Dipinjamkan</h3>
            <p className="text-xs text-slate-500">Pemohon: <strong>{request.namaPemohon}</strong> ({request.namaAlat})</p>

            <div className="grid grid-cols-4 gap-2">
              {[7, 14, 30, 60].map(d => (
                <button key={d} onClick={() => setDays(d)} className={`py-2 rounded-xl text-xs font-bold border ${days === d ? 'bg-emerald-600 text-white' : 'bg-slate-100'}`}>
                  {d} Hari
                </button>
              ))}
            </div>

            <div className="p-3 bg-emerald-50 text-emerald-800 rounded-xl text-[11px]">
              Menyetujui permintaan ini akan <strong>mengurangi stok publik</strong> sebanyak 1 unit.
            </div>

            <div className="flex space-x-2 pt-2">
              <button onClick={onClose} className="w-1/3 py-2.5 bg-slate-100 text-xs font-bold rounded-xl">Batal</button>
              <button onClick={handleSave} className="w-2/3 py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-xl">Terima & Set Stok</button>
            </div>
          </div>
        </div>
      );
    }

    // --- FORM MODAL: INPUT/EDIT EQUIPMENT ---
    function EquipmentForm({ equipmentToEdit, onClose, onSave }) {
      const [form, setForm] = useState({
        namaAlat: '', jenisAlat: 'Mobilisasi', pemilik: 'Dinas Sosial Kulon Progo',
        foto: 'https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&q=80&w=600',
        statusUtama: 'Tersedia', stokTotal: 1, stokTersedia: 1, kondisi: 'Baik', deskripsi: ''
      });

      useEffect(() => {
        if (equipmentToEdit) setForm({ ...equipmentToEdit });
      }, [equipmentToEdit]);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          ...form,
          id: equipmentToEdit ? equipmentToEdit.id : `EQ-${Date.now()}`,
          stokTotal: parseInt(form.stokTotal),
          stokTersedia: parseInt(form.stokTersedia)
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 text-xs">
            <h3 className="font-bold text-slate-900 text-base">{equipmentToEdit ? 'Edit Alat Bantu' : 'Tambah Alat Bantu Baru'}</h3>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block font-bold mb-1">Nama Alat *</label>
                <input type="text" value={form.namaAlat} onChange={e=>setForm({...form, namaAlat: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-xl" required />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block font-bold mb-1">Jenis</label>
                  <select value={form.jenisAlat} onChange={e=>setForm({...form, jenisAlat: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-xl">
                    <option value="Mobilisasi">Mobilisasi</option>
                    <option value="Pendengaran">Pendengaran</option>
                    <option value="Penglihatan">Penglihatan</option>
                    <option value="Perawatan">Perawatan</option>
                  </select>
                </div>
                <div>
                  <label className="block font-bold mb-1">Pemilik / Sumber *</label>
                  <input type="text" value={form.pemilik} onChange={e=>setForm({...form, pemilik: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-xl" required />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block font-bold mb-1">Stok Total</label>
                  <input type="number" min="1" value={form.stokTotal} onChange={e=>setForm({...form, stokTotal: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-xl" />
                </div>
                <div>
                  <label className="block font-bold mb-1">Stok Tersedia</label>
                  <input type="number" min="0" value={form.stokTersedia} onChange={e=>setForm({...form, stokTersedia: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-xl" />
                </div>
              </div>
              <div>
                <label className="block font-bold mb-1">URL Foto</label>
                <input type="text" value={form.foto} onChange={e=>setForm({...form, foto: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-xl" />
              </div>
              <div>
                <label className="block font-bold mb-1">Deskripsi</label>
                <textarea rows={2} value={form.deskripsi} onChange={e=>setForm({...form, deskripsi: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-xl" />
              </div>
              <div className="flex space-x-2 pt-2">
                <button type="button" onClick={onClose} className="w-1/3 py-2.5 bg-slate-100 font-bold rounded-xl">Batal</button>
                <button type="submit" className="w-2/3 py-2.5 bg-slate-900 text-white font-bold rounded-xl">Simpan Data</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
